<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>lista de tarefas</title>
</head>
<body>
    <header>
        
        <!-- primeiro continer janela de inicio -->
        <div class="conteiner">
            <h1>lista de tarefas</h1>
    
            <button class="inico" id="butao-adicionar-tarefa">Adicionar tarefas</button>
            <button class="inico" id="butao-verTarefa">Ver tarefas</button>
            <button class="inico" style="margin-bottom: 1rem;" id="butao-remover-tarefa">Remover tarefas</button>
        
        </div>

    </header>

    <main>
        
        <!-- segundo continer 2 janela adicionar tarefa -->
        <div class="conteiner-adicionar-tarefa">
            <h1 class="titulo-addTarefa">Adicionar tarefas</h1>
            <h2>Erro:campo vazio! por favor digite algo.</h2>
            <input type="text" id="adicionar-tarefa" placeholder="qual tarefa deseja adicionar?">
    
            <div class="conteiner-2janela"> 
                <button class="butao-2janela" id="voltar-da-2janela-inicial">voltar</button>
                <button class="butao-2janela" id="confirmaAddtarefa">adicionar</button>
            </div>
        </div>


        <!-- terceiro conteiner janela ver tarefas -->
         
        <div class="conteiner-3janela">
            <div class="mostrar-tarefas">
                <h1 class="titulo-tarefas">tarefas</h1>
                
                <button class="butao-janela3" id="volta-da3janela-inicio">voltar</button>
            </div>
         
        </div>

        <!-- 4 janela remover tarefas -->
         <div class="conteiner-remover-tarefa">
            <h1>Remover tarefas</h1>
            
            <div class="div-organizar-removertarefa">
                
                <button class="voltar-para-inicio4janela" id="voltapara-inicio-janela4">voltar</button>
                <button>
                    <img src="lixeira.png" id="lixeira">
                </button>
            </div>
            


         </div>
    </main>
    
    
    <script src="script.js"></script>
</body>
</html>
